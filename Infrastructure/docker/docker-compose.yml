# Without this, Compose defaults the project/group name to the folder
# this file lives in — which is "docker" (Infrastructure/docker/), and
# that's what shows up as the stack name in Docker Desktop. Setting it
# explicitly here decouples the project name from the folder structure.
name: employee-directory

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: employee-directory-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: Express
    ports:
      # Exposed to the host so DBeaver (or SSMS/Azure Data Studio) can
      # connect directly to localhost:1433.
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: [
        "CMD-SHELL",
        "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"
      ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - employee-directory-net

  app:
    build:
      # This compose file now lives in Infrastructure/docker/, but the
      # Dockerfile's COPY commands expect the build context to be the
      # project root (where Backend/, Frontend/, and the .csproj live).
      # Compose resolves relative paths relative to *this file's* location,
      # not the current working directory — so "../.." here means "two
      # folders up from Infrastructure/docker/", i.e. the project root.
      context: ../..
      dockerfile: Infrastructure/docker/Dockerfile
    container_name: employee-directory-app
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Double-underscore is ASP.NET Core's convention for nested config
      # keys via environment variables — this overrides
      # ConnectionStrings:DefaultConnection from appsettings.json without
      # touching the file. "db" is the SQL Server service's hostname on
      # the Compose network (not localhost).
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=EmployeeDirectoryDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - employee-directory-net

volumes:
  mssql-data:
    # Named volume so employee data survives `docker compose down`
    # (use `docker compose down -v` to wipe it and start fresh).

networks:
  employee-directory-net:
    driver: bridge